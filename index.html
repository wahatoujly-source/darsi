/* Layout: a school-bag app — teal top bar, catalogue screens (grade → subject → units) and a lesson player that shows one numbered step at a time. */
:root{
  --paper:#F3F7F9; --card:#FFFFFF; --ink:#15314D; --muted:#5A6F82; --line:#D6E1E9;
  --sea:#0A7C86; --sea-soft:#DCEFF0; --sun:#F0AE2E; --sun-soft:#FCEFD2;
  --ok:#2C8A55; --ok-soft:#DDF2E5; --bad:#C4443A; --bad-soft:#F8E0DD;
  --c1:#D9663A; --c2:#2F72C4; --c3:#8B5BC9; --c4:#C9437A; --c5:#1F9A7A;
  --on-color:#FFFFFF; --sun-ink:#2B1E00;
  --f-display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1A25; --card:#152536; --ink:#E6EEF4; --muted:#98ADBF; --line:#25394D;
  --sea:#3EC0C8; --sea-soft:#14363F; --sun:#F2B640; --sun-soft:#3A2E15;
  --ok:#5BC98A; --ok-soft:#173A28; --bad:#F07B71; --bad-soft:#3E1D1A; --on-color:#06222A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1A25; --card:#152536; --ink:#E6EEF4; --muted:#98ADBF; --line:#25394D;
  --sea:#3EC0C8; --sea-soft:#14363F; --sun:#F2B640; --sun-soft:#3A2E15;
  --ok:#5BC98A; --ok-soft:#173A28; --bad:#F07B71; --bad-soft:#3E1D1A; --on-color:#06222A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7}
.app{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
[lang="en"]{font-family:var(--f-display);direction:ltr;unicode-bidi:isolate}
/* maths reads right-to-left, like Libyan textbooks: (−2) + 4 shows as 4 + (2−) */
.m{font-family:var(--f-display);direction:rtl;unicode-bidi:isolate}
.m{font-weight:700;white-space:normal}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h2{font-family:var(--f-display);font-size:1.55rem;margin:0 0 4px;line-height:1.35;text-wrap:balance}
.h3{font-family:var(--f-display);font-size:1.25rem;margin:24px 0 4px}
.lead{color:var(--muted);margin:0 0 16px;max-width:62ch}
.note{font-size:.9rem;color:var(--muted)}
.eyebrow{font-family:var(--f-display);color:var(--sea);font-weight:700;font-size:.9rem}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.stack{display:grid;gap:14px}
.stack>*{min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:9px 16px;font-weight:700;background:var(--sea);color:var(--on-color);display:inline-flex;gap:8px;align-items:center;text-decoration:none}
.btn.ghost{background:var(--sea-soft);color:var(--ink)}
.btn.sun{background:var(--sun);color:var(--sun-ink)}
.btn.okb{background:var(--ok);color:var(--on-color)}
.btn:disabled{opacity:.5;cursor:default}
.feedback{margin-top:12px;padding:10px 14px;border-radius:12px;font-weight:500}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.bad{background:var(--bad-soft);color:var(--bad)}
.feedback.info{background:var(--sun-soft);color:var(--ink)}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sea)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sea);color:var(--on-color);margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px))}
.bar-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar h1{margin:0;font-family:var(--f-display);font-size:1.12rem;font-weight:700;line-height:1.3;min-width:0}
.bar h1 small{display:block;font-size:.78rem;font-weight:500;opacity:.85}
.back{border:0;background:rgba(255,255,255,.16);color:var(--on-color);border-radius:10px;padding:4px 10px;font-weight:700;flex:0 0 auto}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.5rem;letter-spacing:.01em}
.pill{font-family:var(--f-display);white-space:nowrap;background:rgba(255,255,255,.16);padding:2px 12px;border-radius:99px;flex:0 0 auto;border:0;color:var(--on-color)}
.steps{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:0 0 auto;border:0;background:rgba(255,255,255,.14);color:var(--on-color);border-radius:99px;padding:4px 12px;font-size:.88rem;font-weight:500;display:flex;gap:6px;align-items:center}
.steps button[aria-current="step"]{background:var(--on-color);color:var(--sea);font-weight:700}
.steps .n{font-family:var(--f-display);font-weight:800}
.steps .done::after{content:"★";color:var(--sun)}
section{padding-top:12px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:22px}

/* catalogue */
.hero{padding:22px 0 6px}
.hero h2{font-size:1.8rem}
.stage{margin-top:18px}
.stage h3{font-family:var(--f-display);font-size:1.05rem;color:var(--muted);margin:0 0 8px}
.grades{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gcard{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;text-align:start;display:flex;flex-direction:column;gap:2px}
.gcard b{font-family:var(--f-display);font-size:1.15rem}
.gcard.on{border:2px solid var(--sea)}
.gcard.off{opacity:.55;cursor:default}
.tag{display:inline-block;font-size:.75rem;font-weight:700;border-radius:99px;padding:0 10px;background:var(--sea-soft);color:var(--ink);width:max-content}
.tag.sun{background:var(--sun-soft)}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.scard{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:16px;display:flex;gap:14px;align-items:center;text-align:start}
.scard.off{opacity:.55;cursor:default}
.sicon{width:54px;height:54px;border-radius:14px;background:var(--sea);color:var(--on-color);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.4rem;flex:0 0 auto}
.scard.off .sicon{background:var(--line);color:var(--muted)}
.scard b{font-family:var(--f-display);font-size:1.15rem;display:block}
.unit{margin-top:16px}
.unit-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.unit-h b{font-family:var(--f-display);font-size:1.15rem}
.lessons{display:grid;gap:8px}
.lcard{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;display:flex;gap:12px;align-items:center;text-align:start;width:100%}
.lcard .ln{font-family:var(--f-display);font-weight:800;color:var(--sea);min-width:34px;text-align:center}
.lcard .lt{flex:1;min-width:0}
.lcard .lt b{display:block;font-weight:700}
.lcard .lt span{font-size:.85rem;color:var(--muted)}
.lcard .ls{font-size:.85rem;white-space:nowrap;font-weight:700}
.lcard.soon{opacity:.6;cursor:default}
.lcard.locked .ls{color:var(--muted)}
.prog{color:var(--sun)}
.empty{color:var(--muted);font-size:.9rem;padding:4px 2px}

/* subscribe */
.plans{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.plan{border:2px solid var(--line);background:var(--card);border-radius:var(--r);padding:14px;text-align:start}
.plan[aria-pressed="true"]{border-color:var(--sea);background:var(--sea-soft)}
.plan b{font-family:var(--f-display);font-size:1.15rem;display:block}
.pays{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pay{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:10px;font-weight:700}
.code{display:flex;gap:8px;flex-wrap:wrap}
.code input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;font:inherit;background:var(--card);color:var(--ink);direction:ltr;text-align:left;letter-spacing:.08em}

/* english components */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.vcard{border:1px solid var(--line);background:var(--card);border-radius:var(--r);padding:12px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.vcard .em{font-size:2rem;line-height:1.2}
.vcard .en{font-weight:700;line-height:1.3}
.vcard .ar{font-size:.85rem;color:var(--muted)}
.vcard.heard{border-color:var(--sea);background:var(--sea-soft)}
.vcard.playing{outline:3px solid var(--sun)}
.cast{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.who{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:.9rem}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:1.25rem;flex:0 0 auto}
.av.sm{width:26px;height:26px;font-size:.8rem}
.who q{font-family:var(--f-display);font-size:.85rem;color:var(--muted);quotes:none;direction:ltr}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px dashed var(--line);background:var(--card);border-radius:99px;padding:5px 8px 5px 12px;display:inline-flex;align-items:center;gap:8px;font-weight:600;min-height:40px}
.chip.set{border-style:solid}
.chip.right{background:var(--ok-soft);border-color:var(--ok)}
.chip.wrong{background:var(--bad-soft);border-color:var(--bad)}
.chip .slot{width:26px;height:26px;border-radius:50%;border:1.5px dashed var(--line);flex:0 0 auto}
.dlg{display:flex;flex-direction:column;gap:10px}
.line{display:flex;gap:10px;align-items:flex-end;direction:ltr}
.line.r{flex-direction:row-reverse}
.bub{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px 14px;max-width:min(78%,520px);text-align:left;cursor:pointer;min-width:0}
.bub .nm{font-family:var(--f-display);font-weight:700;font-size:.8rem}
.bub .tx{font-family:var(--f-display);font-size:1.08rem;line-height:1.5;font-weight:500}
.line.now .bub{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun-soft)}
.w.hi{background:var(--sun);color:var(--sun-ink);border-radius:4px}
.dlg.hide .tx{filter:blur(6px);user-select:none}
.ctrls{position:sticky;bottom:max(10px,env(safe-area-inset-bottom,0px));margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.gbox h3{font-family:var(--f-display);margin:0 0 6px;font-size:1.15rem}
.verbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.verb{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:8px;text-align:center;direction:ltr}
.verb b{font-family:var(--f-display);font-size:1.05rem;display:block}
.verb span{font-family:var(--f-display);color:var(--muted)}
.verb.flip b{color:var(--sea)}
.ex{font-family:var(--f-display);direction:ltr;text-align:left;background:var(--paper);border-radius:10px;padding:6px 12px;margin:4px 0}
.ex .y{color:var(--ok)} .ex .n{color:var(--bad);text-decoration:line-through}
.ipa{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.ipa div{background:var(--paper);border-radius:10px;padding:8px}
.ipa b{font-family:var(--f-display);font-size:1.2rem;color:var(--sea);display:block;direction:ltr}
.q{border-top:1px solid var(--line);padding:14px 0}
.q:first-child{border-top:0;padding-top:4px}
.stem{font-family:var(--f-display);font-size:1.1rem;direction:ltr;text-align:left;margin-bottom:8px}
.gap{display:inline-block;min-width:70px;border-bottom:2px solid var(--sea);text-align:center;color:var(--sea);font-weight:700}
.opts{display:flex;gap:8px;flex-wrap:wrap;direction:ltr}
.opts.rtl{direction:rtl}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 14px;font-weight:600}
.opt[lang="en"]{font-family:var(--f-display)}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.build{min-height:46px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;gap:6px;flex-wrap:wrap;direction:ltr;margin-bottom:8px}
.tile{border:1px solid var(--line);background:var(--sea-soft);border-radius:8px;padding:4px 10px;font-family:var(--f-display);font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{border-color:var(--sea);background:var(--sea-soft)}
.turn{border:2px solid var(--sun);background:var(--sun-soft);border-radius:var(--r);padding:12px;margin-top:10px}
.turn .tx{font-family:var(--f-display);font-size:1.2rem;direction:ltr;text-align:left;font-weight:600}
.score{font-family:var(--f-display);direction:ltr;text-align:left}
.score .mk{color:var(--ok);font-weight:700} .score .x{color:var(--bad);text-decoration:underline dotted}
.para{font-family:var(--f-display);direction:ltr;text-align:left;font-size:1.15rem;background:var(--paper);border-radius:12px;padding:12px;min-height:56px;line-height:1.6}

/* key words */
.kw-intro{background:var(--sun-soft);border:2px solid var(--sun);border-radius:var(--r);padding:14px 16px;margin-bottom:6px}
.tier{font-family:var(--f-display);font-size:1.15rem;margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.kwlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.kw{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kw.must{border-color:var(--sun);border-width:2px}
.kw-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kw-head.ltr{direction:ltr}
.kw-term{font-family:var(--f-display);font-size:1.25rem;font-weight:800;line-height:1.25}
.kw-term small{font-weight:600;color:var(--sea);font-size:.95rem}
.kw-ipa{font-family:"Segoe UI","Noto Sans",system-ui,sans-serif;color:var(--muted);font-size:.9rem;direction:ltr;text-align:left}
.kw-mean{font-weight:700}
.kw-ex{font-family:var(--f-display);background:var(--paper);border-radius:8px;padding:4px 10px;font-size:.95rem}
.kw-ex.ltr{direction:ltr;text-align:left}
.kw-tip{font-size:.88rem;background:var(--sun-soft);border-radius:8px;padding:4px 10px}
.kw-tip::before{content:"⚠️ "}
.play{border:0;background:var(--sea-soft);border-radius:50%;width:36px;height:36px;flex:0 0 auto;font-size:.9rem}
.fc{background:var(--card);border:2px solid var(--sea);border-radius:18px;padding:22px 16px;text-align:center;min-height:170px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}
.fc .q-front{font-size:1.4rem;font-weight:700}
.fc .a-back{font-family:var(--f-display);font-size:1.5rem;font-weight:800;color:var(--sea)}
.meter{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

/* math */
.nlwrap{overflow-x:auto;direction:ltr;margin:6px 0;-webkit-overflow-scrolling:touch}
.nl{display:block;width:100%;min-width:520px;height:auto;user-select:none}
.nl .axis{stroke:var(--ink);stroke-width:2}
.nl .tick{stroke:var(--ink);stroke-width:2}
.nl .lbl{fill:var(--ink);font-family:var(--f-display);font-size:17px;font-weight:600;text-anchor:middle}
.nl .lbl.zero{font-weight:800;fill:var(--sea)}
.nl .lbl.neg{fill:var(--bad)}
.nl .hit{fill:transparent;cursor:pointer}
.nl .hit:hover{fill:var(--sea-soft)}
.nl .arc{fill:none;stroke-width:2.5}
.nl .arc.p{stroke:var(--ok)} .nl .arc.n{stroke:var(--bad)}
.nl .arclbl{font-family:var(--f-display);font-size:16px;font-weight:800;text-anchor:middle}
.nl .arclbl.p{fill:var(--ok)} .nl .arclbl.n{fill:var(--bad)}
.nl .dot{fill:var(--sun);stroke:var(--ink);stroke-width:1.5}
.nl .pick{fill:none;stroke:var(--sea);stroke-width:3}
.nl .pick.bad{stroke:var(--bad)}
.nl .frog{font-size:30px;text-anchor:middle}
.expr{font-family:var(--f-display);font-size:2rem;font-weight:800;direction:rtl;unicode-bidi:isolate;text-align:center;margin:4px 0}
.expr .ans{color:var(--sea);min-width:1.5em;display:inline-block;border-bottom:3px solid var(--sea)}
.keys{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;direction:ltr}
.key{font-family:var(--f-display);font-size:1.4rem;font-weight:800;min-width:64px;border:0;border-radius:14px;padding:6px 14px;color:var(--on-color)}
.key.p{background:var(--ok)} .key.n{background:var(--bad)} .key.z{background:var(--line);color:var(--ink);font-size:1rem}
.pos{font-family:var(--f-display);text-align:center;font-size:1.05rem}
.wsteps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px}
.wsteps li{border:1px solid var(--line);border-radius:10px;padding:6px 12px;color:var(--muted);display:flex;gap:10px}
.wsteps li b{font-family:var(--f-display);color:var(--muted)}
.wsteps li.on{border-color:var(--sun);background:var(--sun-soft);color:var(--ink)}
.wsteps li.done{color:var(--ink)}
.wsteps li.done b,.wsteps li.on b{color:var(--sea)}
.howto{display:grid;gap:8px}
.howto div{display:flex;gap:12px;align-items:flex-start;background:var(--paper);border-radius:10px;padding:8px 12px}
.howto b:first-child{font-family:var(--f-display);font-size:1.3rem;color:var(--sea);line-height:1.3}
.plus{color:var(--ok)} .minus{color:var(--bad)}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow input{width:110px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;font:inherit;font-family:var(--f-display);font-size:1.3rem;font-weight:700;text-align:center;direction:ltr;background:var(--card);color:var(--ink)}
.numrow input.right{border-color:var(--ok);background:var(--ok-soft)}
.numrow input.wrong{border-color:var(--bad);background:var(--bad-soft)}
.word{font-size:1.05rem;margin-bottom:8px}
.result{border-radius:18px;padding:20px 16px;text-align:center;display:grid;gap:4px;justify-items:center}
.result.ok{background:var(--ok-soft);border:2px solid var(--ok)}
.result.retry{background:var(--sun-soft);border:2px solid var(--sun)}
.result-emo{font-size:3rem;line-height:1.1}
.result-score{font-family:var(--f-display);font-size:2.2rem;font-weight:800;direction:ltr}
.result-msg{font-family:var(--f-display);font-size:1.25rem;font-weight:700;text-wrap:balance}
.paybox{background:var(--card);border:2px solid var(--sea);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.paybig{font-size:1.15rem;padding:12px 20px;justify-content:center}
.banks{display:flex;flex-wrap:wrap;gap:6px}
.banks span{background:var(--sea-soft);border-radius:99px;padding:2px 12px;font-size:.88rem;font-weight:700}
.gcard .tr{font-family:var(--f-display);font-weight:700;color:var(--sea)}
.install{margin-top:16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--card);border:2px solid var(--sun);border-radius:var(--r);padding:12px 14px}
.install b{display:block;font-family:var(--f-display);font-size:1.1rem}
.bookh{margin-top:22px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-bottom:2px solid var(--line);padding-bottom:6px}
.bookh b{font-family:var(--f-display);font-size:1.2rem}
.lcard .lt .lref{display:block;font-size:.8rem;color:var(--sea);font-weight:700}
.refchip{margin-top:12px;display:flex;gap:8px;align-items:center;background:var(--sun-soft);border:1px solid var(--sun);border-radius:12px;padding:6px 12px;font-size:.92rem;width:max-content;max-width:100%}
.read{font-family:var(--f-display);font-size:1.12rem;line-height:1.9;direction:ltr;text-align:left}
.read p{margin:0 0 10px}
.read .sn{cursor:pointer;border-radius:4px;padding:0 1px}
.read .sn:hover{background:var(--sea-soft)}
.read .sn.now{background:var(--sun);color:var(--sun-ink)}
.read.hide .sn{filter:blur(5px)}
.read h4{margin:0 0 8px;font-size:1.15rem}
.read.ar{direction:rtl;text-align:right;font-family:var(--f-body);font-size:1.12rem;line-height:2}
.read .rh{font-family:var(--f-display);font-size:1.1rem;color:var(--sea);margin:14px 0 4px}
.tw{display:flex;flex-wrap:wrap;gap:6px;font-size:1.3rem;line-height:1.6;margin:8px 0}
.tw button{border:1.5px solid transparent;background:var(--paper);border-radius:10px;padding:2px 8px;font-family:var(--f-body)}
.tw button.on{border-color:var(--sea);background:var(--sea-soft)}
.tw button.right{border-color:var(--ok);background:var(--ok-soft)}
.tw button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tw button.miss{border-color:var(--sun);border-style:dashed}
.timeline{display:grid;gap:6px;margin:8px 0}
.timeline .era{display:flex;gap:10px;align-items:stretch}
.timeline .era b{font-family:var(--f-display);min-width:92px;background:var(--sea);color:var(--on-color);border-radius:10px;padding:6px 10px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.9rem}
.timeline .era span{flex:1;background:var(--paper);border-radius:10px;padding:6px 12px;font-size:.92rem}
.timeline .era.pre b{background:var(--sun);color:var(--sun-ink)}
.mail{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mail-h{background:var(--paper);padding:8px 14px;font-size:.92rem;direction:ltr;text-align:left;font-family:var(--f-display)}
.mail .read{padding:12px 14px}
.seqbuild{min-height:52px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.seqbuild.row{flex-direction:row;flex-wrap:wrap}
.seqbank{display:flex;flex-direction:column;gap:6px}
.seqbank.row{flex-direction:row;flex-wrap:wrap}
.seqtile{border:1px solid var(--line);background:var(--sea-soft);border-radius:10px;padding:6px 12px;font-weight:600;text-align:start}
.seqtile .k{font-family:var(--f-display);color:var(--sea);margin-inline-end:6px}
.pv{width:100%;border-collapse:collapse;text-align:center;min-width:560px}
.pv th{font-size:.78rem;color:var(--muted);font-weight:700;padding:4px 2px;border-bottom:1px solid var(--line);writing-mode:vertical-rl;transform:rotate(180deg);height:92px;vertical-align:bottom}
.pv td{padding:4px 2px}
.pv button{font-family:var(--f-display);font-size:1.6rem;font-weight:800;width:42px;height:50px;border-radius:10px;border:1.5px solid var(--line);background:var(--card)}
.pv button.on{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.pvwrap{overflow-x:auto}
.tbl{border-collapse:collapse;margin:6px 0;font-family:var(--f-display)}
.tbl td{border:1px solid var(--line);padding:4px 14px;text-align:center}
.tbl tr.q td{background:var(--sun-soft)}

@font-face{font-family:"QalounKF";src:url("fonts/UthmanicQaloun-v-3.0.ttf") format("truetype");font-display:swap}
.quran{font-family:"QalounKF","Amiri","Traditional Arabic",serif;font-size:1.75rem;line-height:2.5;text-align:justify;text-align-last:center;background:linear-gradient(#fffdf6,#fbf5e6);border:2px solid #d9c38f;border-radius:14px;padding:14px 16px;color:#1b1407;direction:rtl}
.quran .qbasm{text-align:center;margin-bottom:6px;color:#5b3d0a}
.quran .qa{cursor:pointer;border-radius:8px;transition:background .2s}.quran .qa.now,.qv.now{background:#ffe9a8}
.quran .qn{color:#9a6a12;font-size:.9em}
.qv{font-family:"QalounKF","Amiri",serif;font-size:1.3em;line-height:2;color:#1b1407;background:#fbf3df;border-radius:8px;padding:0 4px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.qv::after{content:" 🔊";font-family:system-ui;font-size:.7em}
.qbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;margin:8px 0 2px}
.qsrc{font-size:.8rem;color:var(--muted,#667)}
.qsura{font-family:"QalounKF","Amiri",serif;font-size:1.8rem;line-height:2.6;text-align:justify;text-align-last:center;background:linear-gradient(#fffdf6,#fbf5e6);border:2px solid #d9c38f;border-radius:14px;padding:16px;color:#1b1407;margin-top:12px}
.qsura .qa{cursor:pointer;border-radius:8px}.qsura .qa.now{background:#ffe9a8}.qsura .qn{color:#9a6a12;font-size:.9em}.qsura .qbasm{text-align:center;color:#5b3d0a}
.hadith{font-family:"Amiri","Traditional Arabic",serif;font-size:1.25rem;line-height:2.1;background:var(--paper);border-radius:12px;padding:12px}
.teach-card{margin-top:16px;width:100%;display:flex;gap:14px;align-items:center;text-align:start;background:var(--card);border:2px dashed var(--sea);border-radius:var(--r);padding:12px 14px}
.teach-card .ti{font-size:2rem}
.teach-card b{display:block;font-family:var(--f-display);font-size:1.1rem}
.teach-card .ls{margin-inline-start:auto;font-weight:800;color:var(--sea)}
.toast{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:12px;z-index:60;font-weight:600;max-width:90vw;text-align:center}
.tx{display:grid;gap:14px;padding-top:18px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.9rem;font-weight:600;min-width:0}
.fld input,.qi textarea,.qi input,.qi select,.bank select,.tx select{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--card);color:var(--ink);min-width:0;width:100%}
.qi select,.bank select,.tx select{width:auto}
.chk{display:inline-flex;gap:6px;align-items:center;font-weight:600;cursor:pointer}
.chk input{width:18px;height:18px}
.btn.sm{padding:5px 10px;font-size:.88rem}
.qlist{display:grid;gap:10px;margin-top:10px}
.qi{border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px;background:var(--card)}
.qi.off{opacity:.5}
.qi-top{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.qi-src{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.8rem}
.qi-sub{display:grid;gap:6px}
.qi-sub.row{display:flex}
.qm{width:68px!important;text-align:center}
.ib{border:1px solid var(--line);background:var(--paper);border-radius:8px;width:32px;height:32px;font-weight:800}
.ib.del{color:var(--bad)}
.bank{margin-top:10px;border:2px solid var(--sun);border-radius:12px;padding:10px;background:var(--sun-soft)}
.bank-list{display:grid;gap:6px;max-height:420px;overflow-y:auto;margin-top:6px}
.bq{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:10px;padding:6px 10px}
.bq-t{flex:1;min-width:0;font-size:.92rem}
.sheet-wrap{padding-top:20px}
.tx-actions{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:4;background:var(--paper);padding:8px 0}
/* the exam paper: deliberately paper-white in both themes */
.sheet{--fs:15px;background:#fff;color:#111;font-family:"Tajawal","Segoe UI",Tahoma,"Amiri",sans-serif;font-size:var(--fs);line-height:1.75;border:1px solid #ccd;box-shadow:0 6px 24px rgba(0,0,0,.12);padding:12mm 12mm;max-width:210mm;margin:0 auto 30px;direction:rtl;text-align:right;overflow-wrap:anywhere}
.sheet .m{color:inherit}
.sh-head{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px;border:2px solid #111;border-radius:6px;padding:8px 10px;align-items:center;font-size:.92em}
.sh-c{text-align:center}
.sh-l{text-align:left;direction:rtl}
.sh-title{font-size:1.35em;font-weight:800;font-family:"Baloo Bhaijaan 2","Tajawal",sans-serif}
.sh-key{display:inline-block;border:1.5px solid #b00;color:#b00;border-radius:6px;padding:0 10px;font-weight:800;margin:2px 0}
.sh-student{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1.5px dashed #555;padding:10px 2px 6px;margin-bottom:4px}
.sh-body[dir="ltr"]{text-align:left;font-family:"Segoe UI","Tajawal",sans-serif}
.tsec{margin-top:12px}
.tsec-h{background:#eef1f4;border-inline-start:4px solid #111;padding:4px 10px;margin-bottom:6px;font-weight:600;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.tsec-m{float:inline-end;font-weight:700}
.tq{padding:4px 2px;break-inside:avoid;page-break-inside:avoid}
.tq-n{font-weight:800}
.tq-m{font-size:.85em;color:#444}
.tq-tf{display:flex;gap:6px;align-items:baseline}
.tq-tf .tq-q{flex:1}
.tf-box{display:inline-block;min-width:34px;text-align:center;border:1.5px solid #111;border-radius:4px;padding:0 6px}
.opts-p{display:flex;flex-wrap:wrap;gap:4px 26px;padding-inline-start:22px}
.op.ans-c{outline:2px solid #b00;border-radius:12px;padding:0 6px}
.blank-line{display:inline-block;min-width:130px;border-bottom:1.5px dotted #111;margin:0 4px;height:1em}
.mt{border-collapse:collapse;margin:4px 22px 0;width:calc(100% - 44px)}
.mt th,.mt td{border:1px solid #777;padding:3px 8px}
.mt th{background:#f2f2f2}
.mt-b{width:60px;text-align:center}
.ans-lines{padding-inline-start:22px}
.al{border-bottom:1px dotted #777;height:1.9em}
.sheet .ans{color:#b00;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ans.u{border-bottom:1.5px solid #b00;padding:0 6px}
.sh-foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px;border-top:1.5px solid #111;padding-top:6px;font-weight:600}
@media (max-width:520px){.sheet{padding:14px 12px;font-size:calc(var(--fs) - 2px)}.sh-head{grid-template-columns:1fr 1fr}.sh-c{grid-column:1/-1;order:-1}.sh-l{text-align:right}}
@page{size:A4;margin:10mm}
@media print{
  body{background:#fff!important}
  body::before,.app>*:not(.sheet-wrap),.sheet-wrap>*:not(.sheet),.toast{display:none!important}
  .app{max-width:none;padding:0!important}
  .sheet{border:0;box-shadow:none;padding:0;margin:0;max-width:none}
}
.demo{border:2px dashed var(--sun);border-radius:var(--r);padding:12px 14px;background:var(--sun-soft)}
.err{padding:30px 0}

@media (max-width:520px){ h2{font-size:1.3rem} .cast{gap:6px} .ipa{grid-template-columns:1fr} .expr{font-size:1.6rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.hl{color:#E8590C}
.kgate{display:flex;justify-content:center;padding:26px 0}
.kgo{font-size:1.3rem;padding:12px 30px;border-radius:99px}
.btn.sm{padding:4px 12px;min-height:36px}

.kstage{position:relative;height:360px;margin-top:10px;border-radius:20px;background:linear-gradient(#DFF3FB,#F8FCFF);overflow:hidden}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .kstage{background:linear-gradient(#123042,#0E1A25)}}
:root[data-theme="dark"] .kstage{background:linear-gradient(#123042,#0E1A25)}
.kstage .kgate{position:absolute;inset:0;align-items:center}

.balloon::after{content:"";position:absolute;left:50%;top:100%;width:1.5px;height:34px;background:rgba(80,80,80,.5)}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-500px)}}

.ksyll{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}

.kparts{display:flex;gap:6px;align-items:center;font:700 2rem/1.5 "Amiri",var(--f-display);color:var(--bad)}
.kpart{padding:0 8px;border-radius:10px}.ksep{color:var(--muted)}
.kmatch{display:flex;gap:10px;justify-content:center;align-items:flex-start}
.kcol{display:flex;flex-direction:column;gap:10px}
.kmid{align-self:center;font-size:1.6rem;color:var(--muted)}
.kcol{flex:1;min-width:0;max-width:200px}
.kmatch{gap:6px;width:100%}.kcol{flex:1 1 0}.kmid{flex:0 0 auto;font-size:1.2rem}
.kopt.mt{min-height:64px;min-width:0;width:auto;margin:0;font-size:1.25rem;overflow-wrap:anywhere}

.kpal .sw{width:38px;height:38px;border-radius:99px;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);cursor:pointer}

.btn.ghost.on{background:var(--sea-soft);border-color:var(--sea)}

/* ================= المجتهد — الهوية البصرية =================
   الفكرة: سلّم يصعده الطالب صفاً بعد صف. كل صف له لونه؛ الصفوف الصغيرة ألوانها زاهية وخطها مستدير،
   والكبيرة أعمق وأهدأ وخطها أكثر نضجاً. اللحظة الوحيدة اللافتة: شاشة البداية ومسار الصفوف. */
:root{
  --paper:#F4F6FB; --card:#FFFFFF; --ink:#17203D; --muted:#5B6785; --line:#DFE4EF;
  --sea:#2F55D4; --sea-soft:#E6ECFD; --sun:#FFB800; --sun-soft:#FFF3CC; --sun-ink:#2A1F00;
  --night:#121A3A; --r:18px; --r-sm:12px;
  --g1:#E5484D; --g2:#E2620A; --g3:#2A9D46; --g4:#0E9C9A; --g5:#2F6FED; --g6:#7A4CF4; --g7:#155E96; --g8:#7B2F9E; --g9:#24385E;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1330; --card:#171E42; --ink:#E9EDFB; --muted:#9AA6C9; --line:#283163; --night:#080C22;
  --sea:#7C9BFF; --sea-soft:#1E2A5E; --sun-soft:#3A2F10; --on-color:#0B1030}}
:root[data-theme="dark"]{--paper:#0E1330; --card:#171E42; --ink:#E9EDFB; --muted:#9AA6C9; --line:#283163; --night:#080C22; --sea:#7C9BFF; --sea-soft:#1E2A5E; --sun-soft:#3A2F10; --on-color:#0B1030}

/* لون كل صف */
body[data-g="1"]{--sea:var(--g1)} body[data-g="2"]{--sea:var(--g2)} body[data-g="3"]{--sea:var(--g3)}
body[data-g="4"]{--sea:var(--g4)} body[data-g="5"]{--sea:var(--g5)} body[data-g="6"]{--sea:var(--g6)}
body[data-g="7"]{--sea:var(--g7)} body[data-g="8"]{--sea:var(--g8)} body[data-g="9"]{--sea:var(--g9)}
body[data-g]:not([data-g=""]){--sea-soft:color-mix(in srgb,var(--sea) 13%,var(--card));--on-color:#fff}
/* خط كل مرحلة */
body[data-stage="k"]{--f-display:"Baloo Bhaijaan 2","IBM Plex Sans Arabic",system-ui,sans-serif;--r:22px}
body[data-stage="m"]{--r:18px}
body[data-stage="s"]{--r:14px}
body[data-stage="s"] h2,body[data-stage="s"] .bar h1{font-weight:700;letter-spacing:-.005em}

body{font-family:var(--f-body);background:var(--paper)}
h2{font-weight:800}

/* شريط العنوان */
.bar{background:var(--sea);border-radius:0 0 26px 26px;padding-block:12px 14px;box-shadow:0 8px 24px -14px color-mix(in srgb,var(--sea) 70%,transparent);transition:background .35s}
.bar h1{font-weight:700}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.45rem}
.brand svg{width:30px;height:30px;flex:0 0 auto}
.pill{background:rgba(255,255,255,.18);backdrop-filter:blur(4px);padding:4px 14px}
.back{border-radius:12px}
.home-btn{display:grid;place-items:center;padding:0 8px}

/* الصفحة الرئيسية: مسار الصفوف */
.hero{padding:26px 0 8px}
.hero h2{font-size:clamp(1.7rem,6vw,2.3rem);line-height:1.25}
.hero .lead{font-size:1.02rem}
.climb{position:relative;display:grid;gap:14px;padding:6px 0 10px;margin-top:6px}
.climb::before{content:"";position:absolute;inset-block:20px;inset-inline-start:50%;width:4px;transform:translateX(50%);
  background:repeating-linear-gradient(to bottom,var(--line) 0 10px,transparent 10px 20px);border-radius:4px}
.stone{--c:var(--sea);position:relative;width:min(78%,360px);display:flex;align-items:center;gap:14px;text-align:start;
  background:var(--card);border:0;border-radius:24px;padding:12px 14px;box-shadow:0 1px 0 var(--line),0 10px 26px -18px color-mix(in srgb,var(--c) 60%,transparent);
  transition:transform .18s ease,box-shadow .18s ease}
.stone:nth-child(odd){justify-self:start}
.stone:nth-child(even){justify-self:end}
.stone:active{transform:scale(.97)}
.stone:hover{box-shadow:0 1px 0 var(--line),0 14px 30px -14px color-mix(in srgb,var(--c) 70%,transparent)}
.stone .num{width:58px;height:58px;flex:0 0 auto;border-radius:18px;display:grid;place-items:center;background:var(--c);color:#fff;
  font-family:"Alexandria",sans-serif;font-weight:800;font-size:1.9rem;line-height:1;box-shadow:inset 0 -5px 0 rgba(0,0,0,.14)}
.stone b{display:block;font-family:var(--f-display);font-size:1.12rem}
.stone .st{font-size:.82rem;color:var(--muted)}
.stone.k b{font-family:"Baloo Bhaijaan 2",sans-serif;font-size:1.25rem}
.stone.off{opacity:.55;box-shadow:none;border:1.5px dashed var(--line);background:transparent;cursor:default}
.stone.off .num{background:var(--line);color:var(--muted);box-shadow:none}
.stone.mine{outline:3px solid var(--sun);outline-offset:3px}
.climb-h{font-family:var(--f-display);font-weight:700;font-size:1rem;color:var(--muted);margin:22px 0 2px}

/* المواد والدروس */
.subjects{gap:12px}
.scard{border:0;border-radius:var(--r);box-shadow:0 1px 0 var(--line),0 8px 22px -18px rgba(23,32,61,.5);transition:transform .15s}
.scard:active{transform:scale(.98)}
.sicon{border-radius:16px;background:var(--sea);box-shadow:inset 0 -4px 0 rgba(0,0,0,.14)}
.lcard{border:0;border-radius:16px;box-shadow:0 1px 0 var(--line);transition:transform .15s,background .15s}
.lcard:active{transform:scale(.99)}
.lcard .ln{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--sea-soft);color:var(--sea)}
.unit-h b{font-weight:700}
.teach-card{border:0;background:linear-gradient(135deg,var(--night),#2B3A86);color:#fff;box-shadow:0 12px 26px -16px var(--night)}
.teach-card .note{color:rgba(255,255,255,.75)}.teach-card .ls{color:var(--sun)}
.install{border:0;background:var(--sun-soft);box-shadow:inset 0 0 0 2px var(--sun)}
.btn{border-radius:14px;font-family:var(--f-display);font-weight:700}
.btn.sun{box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
.plan{border-radius:var(--r)}

/* تنقّل سلس بين الشاشات */
@keyframes mjIn{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes mjOut{to{opacity:0;transform:translateX(14px)}}
::view-transition-old(root){animation:mjOut .18s ease-in both}
::view-transition-new(root){animation:mjIn .26s cubic-bezier(.2,.8,.2,1) both}
.app.enter{animation:mjIn .26s cubic-bezier(.2,.8,.2,1)}

/* شاشة البداية */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;align-content:center;gap:14px;background:radial-gradient(120% 80% at 50% 110%,#2B3A86 0%,var(--night) 60%);color:#fff;
  transition:clip-path .55s cubic-bezier(.7,0,.2,1),opacity .55s;clip-path:circle(150% at 50% 50%)}
#splash.go{clip-path:circle(0% at 50% 42%);opacity:.6;pointer-events:none}
#splash .sp-mark{width:132px;height:132px;overflow:visible}
#splash .s1,#splash .s2,#splash .s3{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:spStep .5s cubic-bezier(.3,1.5,.5,1) forwards}
#splash .s2{animation-delay:.16s}#splash .s3{animation-delay:.32s}
#splash .star{transform-box:fill-box;transform-origin:center;opacity:0;animation:spStar .9s .5s cubic-bezier(.2,.9,.3,1.3) forwards}
#splash .glow{opacity:0;animation:spGlow 1.6s .9s ease-in-out infinite}
#splash .sp-word{font-family:"Alexandria",sans-serif;font-weight:800;font-size:2.6rem;letter-spacing:.01em;opacity:0;transform:translateY(10px);animation:spUp .5s .75s ease-out forwards}
#splash .sp-tag{font-family:"IBM Plex Sans Arabic",sans-serif;font-size:1rem;opacity:0;animation:spUp .5s .95s ease-out forwards;color:#C9D3FF}
#splash .sp-bar{width:120px;height:4px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:10px;opacity:0;animation:spUp .3s 1.1s forwards}
#splash .sp-bar i{display:block;height:100%;width:40%;border-radius:4px;background:var(--sun);animation:spLoad 1s 1.1s ease-in-out infinite}
@keyframes spStep{to{transform:scaleY(1)}}
@keyframes spStar{0%{opacity:0;transform:translate(-60px,70px) scale(.3) rotate(-90deg)}70%{opacity:1}100%{opacity:1;transform:none}}
@keyframes spGlow{0%,100%{opacity:.25}50%{opacity:.7}}
@keyframes spUp{to{opacity:1;transform:none}}
@keyframes spLoad{0%{transform:translateX(130%)}100%{transform:translateX(-260%)}}
@media (prefers-reduced-motion: reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}#splash{transition:none}
  ::view-transition-old(root),::view-transition-new(root){animation:none}.app.enter{animation:none}}
.mj-progress{background:var(--card);border-radius:22px;padding:14px 16px;box-shadow:0 1px 0 var(--line),0 12px 28px -20px rgba(23,32,61,.45);display:grid;gap:12px;margin:6px 0 4px}
.mj-progress .lv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.mj-progress .lvi{grid-row:span 2;font-size:2.1rem;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--sun-soft)}
.mj-progress .lv b{font-family:var(--f-display);font-size:1.2rem}.mj-progress .lv small{display:block;font-size:.8rem;color:var(--muted)}
.mj-progress .bar{grid-column:2;height:8px;border-radius:8px;background:var(--line);overflow:hidden}.mj-progress .bar i{display:block;height:100%;background:var(--sun);border-radius:8px}

  background:radial-gradient(closest-side,var(--card) 76%,transparent 78% 100%),conic-gradient(var(--g3) calc(var(--p)*360deg),var(--line) 0)}

.whobox{display:grid;gap:6px}.btn.sm{padding:6px 10px;font-size:.85rem;min-height:0}
.wk{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:150px;padding-top:4px}

.rep{padding-top:6px}.repsheet{font-family:inherit;border-radius:22px;border:0;padding:16px;font-size:15px;line-height:1.6}
.rtabs{display:flex;gap:6px;margin-bottom:12px}.rtabs .btn{flex:1;padding:8px}.rtabs .btn.on{background:var(--night);color:#fff}
.rhead{display:flex;gap:12px;align-items:center;margin-bottom:12px}.rhead .lvi{font-size:2rem;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;background:rgba(255,184,0,.18)}

<script>
(()=>{
'use strict';

const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
{const f=document.getElementById('spFact');if(f){const F=['التعلّم 20 دقيقة كل يوم أفضل من ساعتين مرة في الأسبوع.','الدماغ يتذكّر أكثر عندما تشرح ما تعلّمته لغيرك.','ليبيا من أكبر دول أفريقيا مساحة، ويطلّ ساحلها على البحر المتوسط.','النوم الجيد ليلة الامتحان يساعد على التذكّر أكثر من السهر.','الخطأ خطوة في طريق التعلّم: من يخطئ ثم يصحّح يتعلّم أسرع.','قراءة 10 صفحات يومياً تعني أكثر من 3000 صفحة في السنة!'];f.textContent='💡 هل تعلم؟ '+F[Math.random()*F.length|0];}}

/* ---------- voice profiles per school stage ---------- */
const AGE_PROFILES={
  'primary-1-3':{rate:0.75,slow:0.6,pitchAdd:0.15},
  'primary-4-6':{rate:0.85,slow:0.65,pitchAdd:0.1},

/* ---------- speech synthesis ---------- */
const TTS={synth:window.speechSynthesis||null,en:[],ar:[],map:{},age:AGE_PROFILES['prep-7-9'],rate:0.92,token:0,chars:{}};
const FEM=/female|samantha|karen|serena|kate|libby|sonia|zira|susan|victoria|moira|tessa|fiona|hazel|emma|amy|aria|jenny|ava|allison|nicky|laila|salma|zariyah|hoda|mariam|amina/i;
const MAL=/(^|\W)male|daniel|george|david|james|ryan|guy|arthur|oliver|alex|fred|thomas|mark|aaron|rishi|maged|naayf|hamed|shakir|tarik/i;
function loadVoices(){
  if(!TTS.synth)return;

  TTS.en=all.filter(v=>/^en([-_]|$)/i.test(v.lang)).sort((a,b)=>rank(a)-rank(b));
  TTS.ar=all.filter(v=>/^ar([-_]|$)/i.test(v.lang)).sort((a,b)=>(/ar[-_](LY|EG|SA)/i.test(a.lang)?0:1)-(/ar[-_](LY|EG|SA)/i.test(b.lang)?0:1));
  const fem=TTS.en.filter(v=>FEM.test(v.name)),mal=TTS.en.filter(v=>MAL.test(v.name)&&!FEM.test(v.name)),any=TTS.en[0]||null;

if(TTS.synth){loadVoices();TTS.synth.onvoiceschanged=()=>{loadVoices();assignVoices(TTS.chars);};}
/* if the device has no Arabic voice, tell the family exactly how to add one (the main cause of "no sound") */
function voiceHelp(lang){

  const box=el('div',{class:'voicehelp'},el('b',{text:'🔇 لا يوجد صوت '+(lang==='en'?'إنجليزي':'عربي')+' على هذا الجهاز'}),el('span',{class:'note',text:'لذلك لن تسمع الشرح. الحل سهل ومجاني (دقيقة واحدة):'}),el('ol',{},...steps.map(t=>el('li',{text:t}))),
    el('div',{class:'row',style:'gap:8px'},el('button',{class:'btn sun sm',text:'🔊 جرّب الصوت',onclick:()=>{loadVoices();speak(lang==='en'?'Hello! Welcome to Mujtahid.':'مرحباً بك في منصة المجتهد',{lang});}}),el('button',{class:'btn ghost sm',text:'إخفاء',onclick:()=>{box.remove();store.set('vh_hide_'+lang,Date.now());}})));
  return box;}
function voiceCheck(host,lang){if(TTS.quiet&&lang!=='en')return;if(store.get('vh_seen_'+lang,false))return;
  setTimeout(()=>{loadVoices();const ok=lang==='en'?(TTS.en&&TTS.en.length):(TTS.ar&&TTS.ar.length)||ttsOn();if(!ok&&host.isConnected&&!document.querySelector('.voicehelp')){store.set('vh_seen_'+lang,true);host.prepend(voiceHelp(lang));}},1800);}
/* English letters are spoken by their NAMES (ess, bee, zed…), never as a bare sound the voice may mangle */
const EN_LN={a:'ay',b:'bee',c:'see',d:'dee',e:'ee',f:'eff',g:'jee',h:'aitch',i:'eye',j:'jay',k:'kay',l:'ell',m:'em',n:'en',o:'oh',p:'pee',q:'cue',r:'ar',s:'ess',t:'tee',u:'you',v:'vee',w:'double you',x:'ex',y:'why',z:'zed'};
function enLetters(t){const s=String(t).trim();const toks=s.match(/[A-Za-z]+/g);if(!toks)return t;
  if(toks.every(x=>x.length===1||(x.length===2&&x[0]!==x[1]&&x[0].toLowerCase()===x[1].toLowerCase()))){const ls=[...new Set(toks.map(x=>x[0].toLowerCase()))];if(ls.length<=3)return ls.map(l=>EN_LN[l]).join('. ')+'.';}

/* ===== Phonics (English grade 1): letters are spoken as their SOUND (a as in apple), not their name =====

const PH_AR={s:'سْ',a:'أَ',t:'تْ',p:'بْ',i:'إِ',n:'نْ',c:'كْ',k:'كْ',e:'إيهْ',h:'هْ',r:'رْ',m:'مْ',d:'دْ',o:'أُو',u:'أَهْ',l:'لْ',f:'فْ',b:'بْ',j:'جْ',z:'زْ',w:'وْ',y:'يْ',x:'كْسْ',
  ng:'نْغْ',oo:'أووو',oo2:'أُ',ch:'تْشْ',sh:'شْ',th:'ثْ',th2:'ذْ',ai:'إيْ',oa:'أوْ',ie:'آيْ',ee:'إيييْ',or:'أوووْ',qu:'كْوْ',ou:'آوْ',oi:'أويْ'};

const PH_TOK=/^(ng|oo|ch|sh|th|ai|oa|ie|ee|or|qu|ou|oi|[a-z])$/;
function phToken(t){const x=String(t).trim().replace(/[.,!]/g,' ').trim().split(/\s+/);if(!x.length)return null;
  const toks=x.map(w=>w.toLowerCase()).filter(Boolean);const u=[...new Set(toks.map(w=>w.length===2&&w[0]===w[1]&&!/^(oo|ee)$/.test(w)?w[0]:w))];

async function phSay(tok){let k=(TTS.phx&&TTS.phx[tok])||tok;if(k==='k')k='c';await VOX.load();
  if(VOX.sets.ph&&VOX.sets.ph.has(k)){const ok=await VOX.play('aud/ph/'+k+'.mp3');if(ok)return;}
  if(PH_EN[k])return speak(PH_EN[k],{lang:'en',raw:true});return sayAr(PH_AR[k]||k);}
function speak(text,{who='teacher',lang='en',onWord,rate,raw}={}){
  /* any Arabic sentence sent here (games, hints, 'اضغط على حرف…') goes through the Arabic pipeline: recorded → cloud voice → device */
  if(lang!=='ar'&&!onWord&&!raw&&/[\u0621-\u064A]/.test(String(text)))return speakAr(String(text),{force:true});
  if(lang!=='ar'&&!raw&&TTS.phonics&&!onWord){const s0=String(text).trim();const m=/^([A-Za-z]{1,2})\.\s+(.+)$/.exec(s0);
    if(m&&PH_TOK.test(m[1].toLowerCase()))return phSay(m[1].toLowerCase()).then(()=>speak(m[2],{who,lang,rate,raw:true}));

    if(!TTS.synth){res();return;}

    if(onWord)u.onboundary=e=>{if(e.name==='word'||e.name===undefined)onWord(e.charIndex)};
    let fin=false;const done=()=>{if(!fin){fin=true;res();}};
    const isAnd=/Android/i.test(navigator.userAgent);try{if(TTS.synth.paused)TTS.synth.resume();}catch(e){}
    const ka=isAnd?null:setInterval(()=>{try{if(TTS.synth.speaking){TTS.synth.pause();TTS.synth.resume();}}catch(e){}},9000);
    const done0=done;const done2=()=>{if(ka)clearInterval(ka);done0();};
    u.onend=done2;u.onerror=done2;TTS.synth.speak(u);

/* ---------- Arabic number words (smooth reading of big numbers) ---------- */
const AR_ONES=['صفر','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
const AR_TENS=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
const AR_HUN=['','مائة','مئتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
function ar999(n){const h=Math.floor(n/100),r=n%100,p=[];if(h)p.push(AR_HUN[h]);if(r){if(r<20)p.push(AR_ONES[r]);else{const o=r%10,t=Math.floor(r/10);p.push(o?AR_ONES[o]+' و'+AR_TENS[t]:AR_TENS[t]);}}return p.join(' و');}
function arScale(n,one,two,plural,acc){if(n===1)return one;if(n===2)return two;if(n===200)return 'مئتا '+one;if(n%100===0)return ar999(n)+' '+one;if(n>=3&&n<=10)return ar999(n)+' '+plural;const w=ar999(n);return w+' '+(n%100>=3&&n%100<=10?plural:acc);}
function arNum(n){n=Math.floor(Math.abs(n));if(n===0)return 'صفر';const parts=[];
  const b=Math.floor(n/1e9),m=Math.floor(n%1e9/1e6),t=Math.floor(n%1e6/1e3),r=n%1000;
  if(b)parts.push(arScale(b,'مليار','ملياران','مليارات','مليارًا'));
  if(m)parts.push(arScale(m,'مليون','مليونان','ملايين','مليونًا'));
  if(t)parts.push(arScale(t,'ألف','ألفان','آلاف','ألفًا'));
  if(r)parts.push(ar999(r));return parts.join(' و');}
function arNumbers(t){return String(t).replace(/سم²/g,' سنتيمتر مربع').replace(/كم²/g,' كيلومتر مربع').replace(/م²/g,' متر مربع')
  .replace(/(\d)[    ,،](?=\d{3}(?!\d))/g,'$1').replace(/(\d)[    ,،](?=\d{3}(?!\d))/g,'$1')
  .replace(/(\d+)\.(\d+)/g,(m,a,b)=>arNum(+a)+' فاصلة '+(b.length<=3&&b[0]!=='0'?arNum(+b):b.split('').map(d=>AR_ONES[+d]).join(' ')))
  .replace(/(\d+)\s*%/g,(m,a)=>arNum(+a)+' بالمائة')
  .replace(/(\d{3,4})\s?م(?![\u0621-\u064A])/g,(m,a)=>+a>=1000&&+a<=2100?arNum(+a)+' ميلادي':m).replace(/(\d)\s?(كم|سم|مم|م)(²|³)?(?![\u0621-\u064A])/g,(m,a,u,p)=>a+' '+({'كم':'كيلومتر','سم':'سنتيمتر','مم':'مليمتر','م':'متر'}[u])+(p==='²'?' مربع':p==='³'?' مكعب':'')).replace(/(\d+)\s*هـ/g,(m,a)=>arNum(+a)+' هجري')
  .replace(/\d+/g,m=>m.length>12?m:arNum(+m));}

/* ---------- Quran: Qalun reciter audio for every verse ---------- */
const HAFS_COUNTS=[7, 286, 200, 176, 120, 165, 206, 75, 129, 109, 123, 111, 43, 52, 99, 128, 111, 110, 98, 135, 112, 78, 118, 64, 77, 227, 93, 88, 69, 60, 34, 30, 73, 54, 45, 83, 182, 88, 75, 85, 54, 53, 89, 59, 37, 35, 38, 29, 18, 45, 60, 49, 62, 55, 78, 96, 29, 22, 24, 13, 14, 11, 11, 18, 12, 12, 30, 52, 52, 44, 28, 28, 20, 56, 40, 31, 50, 40, 46, 42, 29, 19, 36, 25, 22, 17, 19, 26, 30, 20, 15, 21, 11, 8, 8, 19, 5, 8, 8, 11, 11, 8, 3, 9, 5, 4, 7, 3, 6, 3, 5, 4, 5, 6];
const QR={reg:[],read:null,timing:{},tried:false,audio:null,label:''};
function hafsGlobal(s,a){let g=0;for(let i=0;i<s-1;i++)g+=HAFS_COUNTS[i];return g+a;}
async function qrInit(){if(QR.tried)return QR.read;QR.tried=true;
  try{const c=store.get('qr_timing_reads',null);let list=c&&Date.now()-c.t<7*864e5?c.list:null;
    if(!list){const j=await fetch('https://www.mp3quran.net/api/v3/ayat_timing/reads').then(r=>r.json());list=Array.isArray(j)?j:(j.reads||j.data||Object.values(j).find(Array.isArray)||[]);store.set('qr_timing_reads',{t:Date.now(),list});}
    const q=list.filter(x=>/قالون|qalon|qaloon|qalun/i.test(JSON.stringify(x)));
    QR.reads=q;const pref=store.get('qr_timing_pref',null);QR.read=q.find(x=>x.id===pref)||q[0]||null;}catch(e){QR.read=null;QR.reads=[];}
  return QR.read;}
async function qrTiming(s){const r=QR.read;if(!r)return null;const k=r.id+':'+s;if(QR.timing[k])return QR.timing[k];
  try{const j=await fetch('https://www.mp3quran.net/api/v3/ayat_timing?surah='+s+'&read='+r.id).then(x=>x.json());const a=Array.isArray(j)?j:(j.data||[]);if(!a.length)return null;QR.timing[k]=a;return a;}catch(e){return null;}}
function qrStop(){if(QR.audio){try{QR.audio.pause()}catch(e){}QR.audio=null;}$$('.qa.now,.qv.now').forEach(x=>x.classList.remove('now'));}
function playSrc(src,{from=0,to=null,onLabel}={}){return new Promise(res=>{qrStop();const a=new Audio();QR.audio=a;a.preload='auto';a.src=src;let fin=false;const done=()=>{if(fin)return;fin=true;try{a.pause()}catch(e){};res();};
  a.addEventListener('loadedmetadata',()=>{try{a.currentTime=from;}catch(e){}a.play().catch(done);},{once:true});
  a.addEventListener('timeupdate',()=>{if(to!=null&&a.currentTime>=to)done();});a.addEventListener('ended',done);a.addEventListener('error',done);
  const tok=TTS.token;const iv=setInterval(()=>{if(tok!==TTS.token||QR.audio!==a){clearInterval(iv);done();}},250);});}
async function playQ(r,{mark}={}){const tok=TTS.token;

  /* try the preferred Qalun reciter, then the other Qalun reciters that have verse timings; never switch to another riwaya */
  const cands=[QR.read,...(QR.reads||[]).filter(x=>x!==QR.read)].filter(Boolean).slice(0,4);

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

const SR_MSG='التعرّف على الصوت غير متاح في هذه المعاينة، وسيعمل عند نشر التطبيق على موقعك (Chrome أو Edge). الآن: استمع إلى النموذج، ثم قل الجملة بصوت عالٍ، وقيّم نفسك.';
function listen(){return new Promise((res,rej)=>{
  if(srBlocked){rej('blocked');return;}
  let r;try{r=new SR();}catch(e){srBlocked=true;rej('blocked');return;}
  r.lang='en-GB';r.interimResults=false;r.maxAlternatives=3;let got=false;
  r.onresult=e=>{got=true;res([...e.results[0]].map(a=>a.transcript));};
  r.onerror=e=>{if(/not-allowed|service-not-allowed|audio-capture/.test(e.error)){srBlocked=true;rej('blocked');}else rej(e.error);};
  r.onend=()=>{if(!got)rej('nospeech');};
  try{r.start();}catch(e){srBlocked=true;rej('blocked');}
});}
const norm=s=>s.toLowerCase().replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean);
function compare(target,alts){let best=null;for(const a of alts){const pool=norm(a);const marks=norm(target).map(w=>{const i=pool.indexOf(w);if(i>-1){pool.splice(i,1);return[w,1]}return[w,0]});const pct=Math.round(100*marks.filter(m=>m[1]).length/marks.length);if(!best||pct>best.pct)best={pct,marks,heard:a};}return best;}
function scoreView(r){const box=el('div',{class:'feedback '+(r.pct>=80?'ok':r.pct>=50?'info':'bad')},el('div',{text:(r.pct>=80?'ممتاز! ':r.pct>=50?'جيد، حاول مرة أخرى لتتحسن. ':'حاول مرة أخرى ببطء. ')+'الدقة '+r.pct+'٪'}));const s=el('div',{class:'score'});r.marks.forEach(([w,ok])=>s.append(el('span',{class:ok?'mk':'x',text:w}),' '));box.append(s,el('div',{class:'note',lang:'en',text:'You said: "'+r.heard+'"'}));return box;}

const MATH_RE=/\(?[−-]?\d+(?:[  ]\d{3}(?!\d))*\)?(?:\s*[+−=×÷≈-]\s*\(?[−-]?\d+(?:[  ]\d{3}(?!\d))*\)?)*/g;

/* number line: SVG with frog, arcs and tap targets */
function NumberLine({min=-8,max=8,frog=null,tappable=false}={}){
  const U=34,P=26,W=(max-min)*U+P*2,H=118,Y=78;
  const X=v=>P+(v-min)*U;
  const NS='http://www.w3.org/2000/svg';
  const s=(t,a={},txt)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;return e;};
  const svg=s('svg',{class:'nl',viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'خط الأعداد من '+min+' إلى '+max});
  svg.append(s('line',{class:'axis',x1:4,y1:Y,x2:W-4,y2:Y}),s('path',{class:'axis',d:`M${W-4} ${Y} l-10 -6 v12 z`,fill:'currentColor',style:'fill:var(--ink)'}),s('path',{d:`M4 ${Y} l10 -6 v12 z`,style:'fill:var(--ink)'}));
  const arcs=s('g'),marks=s('g'),hits=s('g');
  for(let v=min;v<=max;v++){svg.append(s('line',{class:'tick',x1:X(v),y1:Y-7,x2:X(v),y2:Y+7}));svg.append(s('text',{class:'lbl'+(v===0?' zero':v<0?' neg':''),x:X(v),y:Y+28},v<0?(-v)+'−':String(v)));}
  svg.append(arcs,marks);
  const frogEl=s('text',{class:'frog',x:X(frog??0),y:Y-8},'🐸');if(frog==null)frogEl.style.display='none';svg.append(frogEl);
  svg.append(hits);
  let pos=frog??0,tapCb=null;
  if(tappable)for(let v=min;v<=max;v++){const r=s('rect',{class:'hit',x:X(v)-U/2,y:8,width:U,height:H-8,rx:6});r.addEventListener('click',()=>tapCb&&tapCb(v));hits.append(r);}
  const wrap=el('div',{class:'nlwrap'});wrap.append(svg);
  const api={el:wrap,
    get pos(){return pos},
    place(v){pos=v;frogEl.style.display='';frogEl.setAttribute('x',X(v));frogEl.setAttribute('y',Y-8);api.center(v);},
    hideFrog(){frogEl.style.display='none'},
    clear(){arcs.innerHTML='';marks.innerHTML='';},
    center(v){requestAnimationFrame(()=>{const sc=wrap.clientWidth/W>1?1:svg.getBoundingClientRect().width/W;const target=X(v)*sc-wrap.clientWidth/2;if(wrap.scrollWidth>wrap.clientWidth)wrap.scrollTo({left:Math.max(0,target),behavior:reduceMotion?'auto':'smooth'});});},
    mark(v,cls='dot'){const c=cls==='dot'?s('circle',{class:'dot',cx:X(v),cy:Y,r:7}):s('circle',{class:'pick '+(cls==='bad'?'bad':''),cx:X(v),cy:Y,r:13});marks.append(c);return c;},
    async jump(move,{token}={}){
      const dir=Math.sign(move),cls=dir>0?'p':'n';const start=pos;
      for(let i=0;i<Math.abs(move);i++){
        if(token!=null&&token!==TTS.token)return false;
        const a=pos,b=pos+dir,xa=X(a),xb=X(b),h=30;
        arcs.append(s('path',{class:'arc '+cls,d:`M${xa} ${Y} Q${(xa+xb)/2} ${Y-h*2} ${xb} ${Y}`}));
        if(!reduceMotion){const t0=performance.now(),D=320;await new Promise(r=>{const f=t=>{const k=Math.min(1,(t-t0)/D);const x=xa+(xb-xa)*k,y=Y-8-4*h*k*(1-k);frogEl.setAttribute('x',x);frogEl.setAttribute('y',y);k<1?requestAnimationFrame(f):r();};requestAnimationFrame(f);});}
        pos=b;frogEl.setAttribute('x',X(b));frogEl.setAttribute('y',Y-8);api.center(b);
      }
      const mid=(X(start)+X(pos))/2;arcs.append(s('text',{class:'arclbl '+cls,x:mid,y:14},(move>0?'+':'−')+Math.abs(move)));
      return true;
    },
    onTap(cb){tapCb=cb;}
  };
  return api;
}

/* ================= الجدول الدراسي الأسبوعي (حسب خطة وزارة التعليم الليبية 2026/2027) ================= */
const TT=(()=>{
  // weekly periods per subject available on the platform (Quran + Islamic education = isl; writing counted in ar)
  const PLAN={1:{isl:4,ar:6,en:3,comp:1,math:5,art:1},2:{isl:4,ar:6,en:3,comp:1,math:5,art:1},3:{isl:4,ar:6,en:3,comp:1,math:5,sci:2,art:1},
    4:{isl:4,ar:6,en:3,comp:1,math:5,sci:3,soc:2,civ:1,art:1},5:{isl:4,ar:6,en:3,comp:1,math:5,sci:3,soc:2,civ:1,art:1},6:{isl:4,ar:6,en:4,comp:2,math:5,sci:3,soc:2,civ:1,art:1},
    7:{isl:4,ar:5,en:4,comp:2,math:5,sci:4,hist:2,geo:2,civ:1,art:1},8:{isl:4,ar:5,en:4,comp:2,math:5,sci:4,hist:2,geo:2,civ:1,art:1},9:{isl:4,ar:5,en:4,comp:1,math:5,sci:5,hist:2,geo:2,civ:1,art:1}};
  const DAYS=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس'];
  const SPREAD={1:[0],2:[0,3],3:[0,2,4],4:[0,1,3,4]};
  function build(g){g=+g;const subs=((App.catalog&&App.catalog.grades[g])||[]).map(s=>s.id);const plan=PLAN[g]||{};
    const items=Object.entries(plan).filter(([s])=>subs.includes(s)).sort((a,b)=>b[1]-a[1]);
    const days=[[],[],[],[],[]];const load=()=>days.map(d=>d.length);
    for(const [sid,c] of items){
      if(c>=5){for(let d=0;d<5;d++)days[d].push(sid);let extra=c-5;
        // extra periods become a double period on the lightest days
        while(extra>0){const order=[0,1,2,3,4].sort((a,b)=>load()[a]-load()[b]);const d=order.find(x=>days[x].filter(y=>y===sid).length<2)??order[0];days[d].push(sid);extra--;}}
      else{const L=load();const pat=SPREAD[c]||[0];// rotate the pattern to the lightest start day
        let best=0,bs=1e9;for(let r=0;r<5;r++){const sc=pat.reduce((a,x)=>a+L[(x+r)%5],0);if(sc<bs){bs=sc;best=r;}}
        pat.forEach(x=>days[(x+best)%5].push(sid));}}
    // order inside each day: heavy subjects first, doubles together
    const pri=sid=>-(plan[sid]||0);
    return days.map(d=>{const seen=[];d.slice().sort((a,b)=>pri(a)-pri(b)).forEach(x=>seen.push(x));return seen.map(sid=>({s:sid,l:null}));});}
  function deflt(g){return{on:true,mandatory:false,outside:'open',start:'08:00',len:45,brk:{on:true,after:3,len:30},review:0,days:build(g)};}
  const mins=t=>{const [h,m]=String(t||'08:00').split(':').map(Number);return h*60+(m||0);};
  const hm=x=>String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');
  // the clock times of every period of a day
  function times(tt,n){const out=[];let t=mins(tt.start);for(let i=0;i<n;i++){out.push([t,t+(+tt.len||45)]);t+=(+tt.len||45);if(tt.brk&&tt.brk.on&&i+1===+tt.brk.after&&i+1<n)t+=(+tt.brk.len||30);}return out;}
  // where are we now? class / break / off
  function now(tt,date=new Date()){if(!tt||!tt.on)return{state:'none'};const wd=date.getDay();if(wd===5||wd===6)return{state:'off',why:'weekend'};
    const day=tt.days[wd]||[];if(!day.length)return{state:'off',why:'free'};const T=times(tt,day.length),m=date.getHours()*60+date.getMinutes();
    if(m<T[0][0])return{state:'off',why:'before',next:T[0][0],day,T};if(m>=T[T.length-1][1])return{state:'off',why:'after',day,T};
    for(let i=0;i<T.length;i++){if(m>=T[i][0]&&m<T[i][1])return{state:'class',i,slot:day[i],from:T[i][0],to:T[i][1],day,T};}
    const i=T.findIndex(x=>x[0]>m);return{state:'break',until:T[i][0],next:day[i],day,T};}
  return{PLAN,DAYS,build,deflt,times,now,hm};
})();

function lessonBank(L,subj){

  const conv=it=>{
    if(it.type==='listen'||it.say&&it.type==='listen')return;
    const qtext=(it.q||it.s||'').replace(/___/g,'____');if(!qtext)return;
    if(it.type==='input'){add({t:subj==='math'?'calc':'short',q:qtext,a:typeof it.a==='number'?fmt(it.a):String(it.a),m:subj==='math'?1:2,lines:1,src:L.title});return;}

    if(it.o){add({t:'mcq',q:qtext,o:[...it.o],a:it.a,m:1,src:L.title});}
  };
  const walk=b=>{if(!b)return;if((b.type==='quiz'||b.type==='choice'||b.type==='mcq')&&b.items)b.items.forEach(it=>conv(b.type==='mcq'&&it.s?{...it,q:it.s}:it));(b.blocks||[]).forEach(walk);(b.tabs||[]).forEach(t=>(t.blocks||[]).forEach(walk));};
  L.steps.forEach(s=>s.blocks.forEach(walk));
  return out;
}

const QALIAS={'الانشراح':94,'تبت':111,'الدهر':76,'المؤمن':40,'المجادله':58};
function qnorm(t){return t.replace(/[ً-ْٰـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').trim();}
const QIDX=Object.fromEntries(SURAS.map((n,i)=>[qnorm(n),i+1]));
function suraNum(title){if(!/^\s*سورة\s/.test(title||''))return 0;let t=title.replace(/^\s*سورة\s+/,'').split(/[(—–\-:،]/)[0];t=qnorm(t);return QIDX[t]||QALIAS[t]||0;}
async function qalunReciters(){
  const c=store.get('qr_list_v1',null);if(c&&Date.now()-c.t<7*864e5&&c.list.length)return c.list;
  const API='https://www.mp3quran.net/api/v3/';
  const rw=await fetch(API+'riwayat?language=ar').then(r=>r.json());
  const arr=rw.riwayat||rw.rewayah||Object.values(rw).find(Array.isArray)||[];
  const riw=arr.find(x=>/قالون/.test(x.name||''));if(!riw)throw new Error('no qalun');
  const R=await fetch(API+'reciters?language=ar&rewaya='+riw.id).then(r=>r.json());
  let list=[];(R.reciters||[]).forEach(rc=>{let ms=(rc.moshaf||[]).filter(m=>/قالون/.test(m.name||''));if(!ms.length)ms=rc.moshaf||[];
    ms.forEach(m=>list.push({id:rc.id+'-'+m.id,name:rc.name,moshaf:m.name||'',server:m.server,suras:String(m.surah_list||'').split(',').map(Number)}));});
