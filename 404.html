<script>
/* أي رابط قديم أو غير موجود يرجع إلى المكان الصحيح داخل المنصة بدل صفحة خطأ */
(function(){var p=location.pathname,m,h='';
if((m=/^\/l\/([a-z0-9-]+)\/?/.exec(p)))h='#l-'+m[1];
else if((m=/^\/g\/([a-z0-9]+)\/([a-z]+)\/?/.exec(p)))h='#g'+m[1]+'-'+m[2];
else if((m=/^\/g\/([a-z0-9]+)\/?/.exec(p)))h='#g'+m[1];
location.replace('/'+location.search+(h||location.hash));})();
</script></head>
